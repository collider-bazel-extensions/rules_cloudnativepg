---
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
# SelfSigned ClusterIssuer — the simplest cert-manager issuer for tests.
# Real production deployments would use a CA-backed issuer instead.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: smoke-selfsigned
spec:
  selfSigned: {}
---
# Certificate that produces a Secret with the keys CNPG expects:
# `tls.crt`, `tls.key`, `ca.crt`. cert-manager-issued — proves the
# rules_certmanager + rules_cloudnativepg composition.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smoke-server-cert
  namespace: smoke
spec:
  secretName: smoke-server-tls
  issuerRef:
    name: smoke-selfsigned
    kind: ClusterIssuer
  commonName: smoke-rw.smoke.svc
  # CNPG validates the cert against per-pod DNS names too. Cover the
  # 1-instance pod we use here + the rw/ro Services.
  dnsNames:
    - smoke-rw
    - smoke-rw.smoke
    - smoke-rw.smoke.svc
    - smoke-rw.smoke.svc.cluster.local
    - smoke-1
    - smoke-1.smoke-rw
    - smoke-1.smoke-rw.smoke.svc
    - smoke-1.smoke-rw.smoke.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
---
# CNPG Cluster referencing the cert-manager-issued Secret. 1 instance is
# enough here — the assertion is "cert-manager + CNPG compose," not HA.
# (HA replication is exercised by the default smoke.)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: smoke
  namespace: smoke
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  storage:
    size: 256Mi
    storageClass: standard
  postgresql:
    parameters:
      shared_buffers: "32MB"
      max_connections: "20"
  certificates:
    # CNPG accepts the same Secret as both server cert + server CA when
    # the cert is self-signed (the cert IS its own CA). The Secret's
    # `ca.crt` key is what cert-manager populates from the SelfSigned
    # issuer's chain.
    serverTLSSecret: smoke-server-tls
    serverCASecret: smoke-server-tls
